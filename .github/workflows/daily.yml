name: Generate Daily Report

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rss-data-writer
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DEEPSEEK_MODEL: deepseek-v4-flash
      SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Collect latest items
        run: python src/rss_weekreport.py collect
      - name: Generate daily report and RSS feed
        run: python src/rss_weekreport.py generate --period daily
      - name: Persist report and published feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/items.jsonl reports/ docs/
          git diff --cached --quiet || git commit -m "docs: generate daily RSS report"
          git push
