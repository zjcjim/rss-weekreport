name: Collect RSS

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rss-data-writer
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Collect feeds
        run: python src/rss_weekreport.py collect
      - name: Persist new items
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/items.jsonl
          git diff --cached --quiet || git commit -m "data: collect RSS items"
          git push
